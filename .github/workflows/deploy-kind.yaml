name: CI/CD Node.js backend to kind

on:
  push:
    branches: [ dev_v1 ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout code
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2️⃣ Set up Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3️⃣ Install kind
    - name: Install kind
      uses: helm/kind-action@v1.8.0

    # 4️⃣ Create kind cluster
    - name: Create kind cluster
      run: kind create cluster --wait 60s

    # 5️⃣ Build Docker image
    - name: Build Docker image from backend folder
      run: docker build -t backend-app:latest ./backend

    # 6️⃣ Log in to Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 7️⃣ Push image to Docker Hub
    - name: Push Docker image
      run: |
        docker tag backend-app:latest ${{ secrets.DOCKER_USERNAME }}/backend-app:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/backend-app:latest

    # 8️⃣ Load Docker image into kind
    - name: Load image into kind cluster
      run: kind load docker-image backend-app:latest

    # 9️⃣ Deploy backend and service to Kubernetes
    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml
        kubectl get pods
        kubectl get svc
